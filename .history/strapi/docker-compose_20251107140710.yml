version: '3'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flolabs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '5433:5432'

  strapi:
    image: node:18-alpine
    container_name: flolabs-strapi
    restart: unless-stopped
    working_dir: /srv/app
    command: sh -c "npm install && npm run develop"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      JWT_SECRET: ${JWT_SECRET:-changeme-generate-secure-secret}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-changeme-generate-secure-admin-secret}
      APP_KEYS: ${APP_KEYS:-changeme-generate-app-keys}
      API_TOKEN_SALT: ${API_TOKEN_SALT:-changeme-generate-token-salt}
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 1337
    volumes:
      - ./app:/srv/app
      - /srv/app/node_modules
    ports:
      - '1337:1337'
    depends_on:
      - postgres

volumes:
  postgres-data:
